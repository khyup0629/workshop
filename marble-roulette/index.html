<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>럭키 마블 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: arcade cabinet. A control rail on the left, a tall pinball playfield on the right, and a strip map of the whole course along the playfield's edge. */
:root{
  --cabinet:#0b0f24;
  --panel:#0f1430;
  --field:#131a3c;
  --field-2:#172048;
  --rail:#e2b24a;
  --rail-hi:#ffe3a1;
  --chrome:#cdd5e8;
  --hot:#ff4d8d;
  --hot-deep:#a3194f;
  --win:#ffd45c;
  --ink:#eef1fb;
  --ink-dim:#97a0c6;
  --line:rgba(205,213,232,.13);
  --glass:rgba(11,15,36,.8);
  --font-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-num:"Chakra Petch","IBM Plex Sans KR",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--cabinet)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--cabinet);color:var(--ink);font:400 14px/1.5 var(--font-body);word-break:keep-all;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,canvas:focus-visible{outline:2px solid var(--win);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:340px minmax(0,1fr)}

/* ---------- control rail ---------- */
.panel>*{flex-shrink:0}
.panel{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding-top:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:18px;background:var(--panel);border-right:1px solid var(--line)}

.marquee{position:relative;padding:22px 18px 20px;border-radius:16px;background:radial-gradient(130% 100% at 0% 0%,#24316e 0%,var(--field) 62%);border:1px solid var(--line);overflow:hidden}
.marquee::before,.marquee::after{content:"";position:absolute;left:10px;right:10px;height:8px;background-image:radial-gradient(circle,var(--win) 0 2.4px,transparent 3px),radial-gradient(circle,rgba(255,212,92,.22) 0 2.4px,transparent 3px);background-size:36px 8px,12px 8px;background-repeat:repeat-x}
.marquee::before{top:6px}
.marquee::after{bottom:6px}
.app.is-racing .marquee::before{animation:chase .5s linear infinite}
.app.is-racing .marquee::after{animation:chase .5s linear infinite reverse}
.app.is-done .marquee::before,.app.is-done .marquee::after{animation:blink .45s steps(2,jump-none) infinite}
@keyframes chase{to{background-position:36px 0,0 0}}
@keyframes blink{50%{opacity:.25}}
.eyebrow{margin:4px 0 6px;font:700 11px/1 var(--font-num);letter-spacing:.24em;color:var(--hot)}
.marquee h1{margin:0;font:400 46px/.98 var(--font-display);color:var(--win);letter-spacing:-.01em;text-shadow:3px 3px 0 var(--hot),6px 6px 0 rgba(0,0,0,.35);text-wrap:balance}
.marquee .sub{margin:12px 0 0;color:var(--ink-dim);font-size:13px;line-height:1.55;max-width:32ch}

.block{display:flex;flex-direction:column;gap:10px}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-dim)}
.label label{cursor:pointer}
.count{font:500 12px/1 var(--font-num);letter-spacing:.02em;color:var(--rail-hi);font-variant-numeric:tabular-nums}

.entry-row{display:flex;gap:8px;margin:0}
.entry-row input{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--cabinet);color:var(--ink);font:500 15px var(--font-body)}
.entry-row input::placeholder{color:#5d6690}
.btn-add{height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--rail);color:#2b1d00;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn-add:active{transform:translateY(1px)}
.hint{margin:0;font-size:12px;line-height:1.5;color:var(--ink-dim)}
.hint code{font-family:var(--font-num);font-size:12px;padding:1px 5px;border-radius:5px;background:rgba(205,213,232,.08);color:var(--rail-hi)}
.msg{margin:0;min-height:18px;font-size:12px;color:var(--win)}

.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;max-height:232px;overflow-y:auto}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;max-width:100%;padding:3px 4px 3px 10px;border-radius:999px;background:rgba(205,213,232,.05);border:1px solid var(--line)}
.chip .dot,.row .dot,.winners .dot,.fdot,.tn::before{flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 13%,var(--c) 46%)}
.chip .dot{width:12px;height:12px}
.chip .nm{font-weight:500;overflow-wrap:anywhere}
.chip .wt{font:700 11px/1 var(--font-num);color:var(--rail-hi)}
.chip .x{width:24px;height:24px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--ink-dim);font-size:16px;line-height:1;display:grid;place-items:center}
.chip .x:hover{background:rgba(255,77,141,.18);color:var(--hot)}
.example-note{margin:0;padding:8px 10px;border-radius:10px;border:1px dashed rgba(226,178,74,.45);font-size:12px;color:var(--rail-hi)}
.text-btn{align-self:flex-start;border:0;background:none;padding:4px 0;color:var(--ink-dim);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.text-btn:hover{color:var(--ink)}
.text-btn.armed{color:var(--hot)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--cabinet);border:1px solid var(--line)}
.seg button{height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink-dim);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--field-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rail)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;border-radius:12px;background:var(--cabinet);border:1px solid var(--line)}
.stepper button{width:44px;height:40px;border:0;background:transparent;font-size:18px;color:var(--ink)}
.stepper button:disabled{color:#4b5378;cursor:not-allowed}
.stepper output{min-width:40px;text-align:center;font:700 18px/1 var(--font-num);font-variant-numeric:tabular-nums}
.rule{margin:0;font-size:13px;color:var(--ink)}

.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.row{width:100%;display:grid;grid-template-columns:30px 14px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;border:1px solid transparent;background:rgba(205,213,232,.04);text-align:left}
.row:hover{background:rgba(205,213,232,.09)}
.row .pos{font:700 14px/1 var(--font-num);color:var(--ink-dim);text-align:right;font-variant-numeric:tabular-nums}
.row .dot{width:14px;height:14px}
.row .nm{display:flex;align-items:center;gap:6px;font-weight:500;overflow-wrap:anywhere;min-width:0}
.row .meta{font:500 12px/1 var(--font-num);color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.fin .meta{color:var(--rail-hi)}
.row.win{background:linear-gradient(90deg,rgba(255,212,92,.22),rgba(255,212,92,.04));border-color:rgba(255,212,92,.5)}
.row.win .pos{color:var(--win)}
.row.win .nm::after{content:"당첨";flex:none;padding:3px 6px;border-radius:6px;background:var(--win);color:var(--cabinet);font-size:10px;font-weight:700;line-height:1}
.row.safe{opacity:.55}
.row.safe .nm::after{content:"탈출";flex:none;padding:2px 5px;border-radius:6px;border:1px solid var(--line);font-size:10px;line-height:1}
.row.followed{border-color:var(--ink)}

.go-wrap{position:sticky;bottom:0;margin-top:auto;padding-block:14px max(18px,env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(15,20,48,0),var(--panel) 32%)}
.go{width:100%;height:64px;border:0;border-radius:16px;background:linear-gradient(180deg,#ff6ea4,var(--hot));color:#fff;font:400 28px/1 var(--font-display);letter-spacing:.03em;box-shadow:0 5px 0 var(--hot-deep),0 12px 26px rgba(255,77,141,.32);transition:transform .08s,box-shadow .08s}
.go:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--hot-deep),0 6px 14px rgba(255,77,141,.3)}
.go:disabled{filter:grayscale(.8);opacity:.55;cursor:not-allowed}
.go.is-stop{background:var(--field-2);color:var(--ink);font-size:22px;box-shadow:0 5px 0 #070a18,inset 0 0 0 1px var(--line)}

/* ---------- playfield ---------- */
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--cabinet)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#view.dragging{cursor:grabbing}
#mini{position:absolute;top:12px;right:max(10px,env(safe-area-inset-right,0px));width:44px;height:calc(100% - 24px);border-radius:8px;cursor:pointer;touch-action:none;box-shadow:0 0 0 1px var(--line)}
.hud{position:absolute;top:12px;left:12px;right:68px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.clock{padding:8px 12px 8px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.clock .t{font:700 26px/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .s{margin-top:5px;font-size:12px;line-height:1.3;color:var(--ink-dim)}
.hud-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.icon-btn{height:36px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="false"]{color:var(--ink-dim)}
.fdot{width:12px;height:12px}

.banner{position:absolute;inset:0 56px 0 0;display:grid;place-items:center;pointer-events:none;text-align:center}
.banner-text{font:400 clamp(30px,6vw,64px)/1 var(--font-display);color:var(--win);text-shadow:4px 4px 0 var(--hot),8px 8px 0 rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;padding:0 16px}
.banner-text.count{font-size:clamp(84px,16vw,180px);text-shadow:6px 6px 0 var(--hot),12px 12px 0 rgba(0,0,0,.35)}
.banner-text.launch{color:var(--ink)}
.banner-text.out{animation:bannerOut .35s ease-in forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bannerOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}

.bottom{position:absolute;left:12px;right:68px;bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.feed{display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:100%}
.toast{max-width:100%;padding:7px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--line);font-size:13px;line-height:1.4;animation:toastIn .25s ease-out both;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.toast b{font-family:var(--font-num);color:var(--win);letter-spacing:.04em}
.toast.gold{border-color:rgba(255,212,92,.65)}
.toast.hot{border-color:rgba(255,77,141,.7)}
.toast.out{animation:toastOut .35s ease-in forwards}
.tn{display:inline-flex;align-items:center;gap:5px;font-weight:700;color:var(--c)}
.tn::before{content:"";width:10px;height:10px}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
.leaderbar{width:min(440px,100%);display:flex;flex-direction:column;gap:7px;padding:9px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lb-text{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.lb-track{position:relative;height:6px;border-radius:3px;background:rgba(205,213,232,.12);overflow:hidden}
.lb-track i{position:absolute;inset:0;background:linear-gradient(90deg,var(--hot),var(--win));transform-origin:left center;transform:scaleX(0)}

/* ---------- result ---------- */
.result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(5,7,18,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:min(440px,100%);max-height:100%;overflow:auto;padding:26px 22px 20px;border-radius:20px;background:var(--panel);border:1px solid rgba(255,212,92,.45);box-shadow:0 30px 80px rgba(0,0,0,.55);text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.card h2{margin:4px 0 18px;font:400 60px/1 var(--font-display);color:var(--win);text-shadow:4px 4px 0 var(--hot),8px 8px 0 rgba(0,0,0,.35)}
.winners{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.winners li{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;padding:10px 12px;border-radius:12px;background:rgba(255,212,92,.08)}
.winners .dot{width:22px;height:22px}
.winners .wn{font-size:26px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.winners .wm{font:500 13px/1 var(--font-num);color:var(--ink-dim)}
.res-meta{margin:0 0 18px;font:500 12px/1.4 var(--font-num);color:var(--ink-dim);letter-spacing:.04em}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card-actions .go{grid-column:1/-1;height:58px;font-size:24px}
.ghost{min-height:46px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(205,213,232,.05);color:var(--ink);font-weight:700;font-size:14px}
.ghost:hover:not(:disabled){background:rgba(205,213,232,.1)}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.ghost.wide{grid-column:1/-1}
.card textarea{width:100%;min-height:130px;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--cabinet);color:var(--ink);font:500 12px/1.5 var(--font-num);resize:vertical}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,58fr) minmax(0,42fr)}
  .stage{order:-1}
  .panel{border-right:0;border-top:1px solid var(--line);padding-top:14px;padding-right:max(16px,env(safe-area-inset-right,0px));gap:18px}
  .marquee{padding:18px 14px 16px}
  .marquee h1{font-size:32px}
  .marquee h1 br{display:none}
  .marquee .sub{display:none}
  .app.is-racing .marquee,.app.is-done .marquee{display:none}
  .hud{right:56px;left:10px;top:10px}
  .bottom{right:56px;left:10px;bottom:10px}
  #mini{width:34px;top:10px;height:calc(100% - 20px);right:max(8px,env(safe-area-inset-right,0px))}
  .clock .t{font-size:20px}
  .icon-btn .lbl{display:none}
  .feed .toast:nth-last-child(n+3){display:none}
  .banner{inset:0 44px 0 0}
  .go{height:56px;font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  .app.is-racing .marquee::before,.app.is-racing .marquee::after,.app.is-done .marquee::before,.app.is-done .marquee::after{animation:none}
  .banner-text,.toast,.card{animation:none}
  .banner-text.out,.toast.out{animation:none;opacity:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="panel" id="panel" aria-label="추첨 설정">
    <header class="marquee">
      <p class="eyebrow">LUCKY DRAW · MARBLE RACE</p>
      <h1>럭키 마블 <br>룰렛</h1>
      <p class="sub" id="ruleSub">결승선을 가장 먼저 넘는 구슬의 주인이 당첨돼요.</p>
    </header>

    <section class="block" id="entryBlock">
      <div class="label"><label for="nameInput">참가자</label><span class="count" id="countLabel"></span></div>
      <form class="entry-row" id="entryForm" autocomplete="off">
        <input id="nameInput" name="nameInput" type="text" maxlength="400" placeholder="이름 입력 후 Enter" enterkeyhint="done">
        <button class="btn-add" type="submit">추가</button>
      </form>
      <p class="hint">쉼표로 여러 명을 한 번에 넣을 수 있어요. <code>이름*3</code>처럼 쓰면 구슬이 3개가 돼요.</p>
      <p class="msg" id="entryMsg" role="status"></p>
      <ul class="chips" id="chips" aria-label="참가자 목록"></ul>
      <p class="example-note" id="exampleNote">예시 명단이에요. 이름을 추가하면 예시는 사라져요.</p>
      <button type="button" class="text-btn" id="clearBtn">전체 삭제</button>
    </section>

    <section class="block" id="settingsBlock">
      <div class="label">당첨 방식</div>
      <div class="seg" role="group" aria-label="당첨 방식">
        <button type="button" id="modeFirst" aria-pressed="true">먼저 도착</button>
        <button type="button" id="modeLast" aria-pressed="false">꼴찌 당첨</button>
      </div>
      <div class="setting-row">
        <div class="label">당첨 인원</div>
        <div class="stepper">
          <button type="button" id="kMinus" aria-label="당첨 인원 줄이기">−</button>
          <output id="kOut" aria-live="polite">1</output>
          <button type="button" id="kPlus" aria-label="당첨 인원 늘리기">+</button>
        </div>
      </div>
      <p class="rule" id="ruleText"></p>
    </section>

    <section class="block" id="rankBlock" hidden>
      <div class="label"><span>실시간 순위</span><span class="count" id="rankInfo"></span></div>
      <ol class="rank" id="rankList"></ol>
      <button type="button" class="text-btn" id="reopenBtn" hidden>결과 다시 보기</button>
    </section>

    <div class="go-wrap"><button type="button" class="go" id="goBtn">출발!</button></div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="view" aria-label="마블 레이스 코스. 구슬을 누르면 그 구슬을 따라가요."></canvas>
    <canvas id="mini" aria-label="코스 전체 지도. 누르면 그 위치로 이동해요."></canvas>
    <div class="hud">
      <div class="clock"><div class="t" id="clock">00:00.00</div><div class="s" id="status">구슬 대기 중</div></div>
      <div class="hud-btns">
        <button type="button" class="icon-btn" id="followChip" aria-label="추적 해제" hidden></button>
        <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path id="soundWave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path id="soundMute" d="M16 9.5l5 5M21 9.5l-5 5" hidden/></svg>
          <span class="lbl" id="soundLbl">소리 켬</span>
        </button>
      </div>
    </div>
    <div class="banner" id="banner" aria-live="assertive"></div>
    <div class="bottom">
      <div class="feed" id="feed" aria-live="polite"></div>
      <div class="leaderbar"><div class="lb-text" id="lbText"></div><div class="lb-track"><i id="lbFill"></i></div></div>
    </div>
  </main>
</div>

<div class="result" id="result" role="dialog" aria-modal="true" aria-labelledby="resTitle" hidden>
  <div class="card">
    <p class="eyebrow" id="resEyebrow"></p>
    <h2 id="resTitle">당첨!</h2>
    <ul class="winners" id="winners"></ul>
    <p class="res-meta" id="resMeta"></p>
    <div class="card-actions">
      <button type="button" class="go" id="againBtn">한 판 더</button>
      <button type="button" class="ghost" id="excludeBtn">당첨자 빼고 한 판 더</button>
      <button type="button" class="ghost" id="copyBtn">결과 복사</button>
      <button type="button" class="ghost wide" id="closeBtn">닫기</button>
    </div>
    <textarea id="copyFallback" aria-label="복사할 결과" readonly hidden></textarea>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- constants ----------
  const TAU = Math.PI * 2;

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; }

  const hueOf = (i) => (i * 137.508 + 8) % 360;
  const colorOf = (i) => 'hsl(' + hueOf(i).toFixed(1) + ', 86%, 61%)';
  const darkOf = (i) => 'hsl(' + hueOf(i).toFixed(1) + ', 72%, 28%)';

  // ---------- state ----------
  const S = {
    participants: [], example: false, mode: 'first', winners: 1, muted: false,
    phase: 'idle', simT: 0, raceTime: 0, endTime: 0, timeScale: 1, slowHold: 0,
    cdT: 0, cdBeat: -1, follow: null, manual: null,
    winnerNames: new Set(), winnerList: [], finishOrder: [], remain: new Set(),
    front: null, back: null, leader: null, decisive: null, decisiveOn: false, finalShown: false, heartT: 0,

  let marbles = [];

  // ---------- sound ----------
  const Snd = {
    ctx: null, out: null, nb: null, lastPin: 0, lastThud: 0, lastBoing: 0,
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        const c = new AC();
        const comp = c.createDynamicsCompressor();
        comp.threshold.value = -16; comp.ratio.value = 6;
        this.out = c.createGain(); this.out.gain.value = 0.6;
        this.out.connect(comp); comp.connect(c.destination);
        const len = Math.floor(c.sampleRate * 0.8), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.nb = b; this.ctx = c;
      } catch (e) { this.ctx = null; }
    },
    on() { return !!this.ctx && !S.muted && this.ctx.state === 'running'; },
    tone(f, dur, o) {
      if (!this.on()) return;
      o = o || {};
      const c = this.ctx, t = c.currentTime + (o.at || 0);
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.12, t + (o.atk || 0.005));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(this.out);
      osc.start(t); osc.stop(t + dur + 0.05);
    },
    noise(dur, o) {
      if (!this.on() || !this.nb) return;
      o = o || {};
      const c = this.ctx, t = c.currentTime + (o.at || 0);
      const src = c.createBufferSource(); src.buffer = this.nb;
      const f = c.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
      f.frequency.setValueAtTime(o.freq || 1000, t);
      if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t + (o.atk || 0.01));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(this.out);

    },
    pin(imp) {
      if (!this.on()) return;
      const t = this.ctx.currentTime; if (t - this.lastPin < 0.03) return; this.lastPin = t;
      this.tone(1400 + Math.random() * 1300, 0.06, { type: 'triangle', vol: Math.min(0.08, 0.015 + imp / 10000) });
    },
    thud(imp) {
      if (!this.on()) return;
      const t = this.ctx.currentTime; if (t - this.lastThud < 0.05) return; this.lastThud = t;
      this.noise(0.07, { freq: 700 + Math.random() * 400, q: 3, vol: Math.min(0.16, 0.03 + imp / 6000) });
    },
    boing() {
      if (!this.on()) return;
      const t = this.ctx.currentTime; if (t - this.lastBoing < 0.06) return; this.lastBoing = t;
      const f = 200 + Math.random() * 80;
      this.tone(f, 0.22, { type: 'square', vol: 0.05, to: f * 3 });
      this.tone(f * 2, 0.16, { vol: 0.09, to: f * 6 });
    },
    beep(go) {
      if (go) { this.tone(1046.5, 0.55, { type: 'square', vol: 0.08 }); this.tone(1568, 0.55, { vol: 0.09 }); }
      else this.tone(659.3, 0.16, { type: 'square', vol: 0.08 });
    },
    whoosh() { this.noise(0.7, { freq: 300, to: 4200, vol: 0.16, q: 0.8, atk: 0.06 }); },
    ding() { this.tone(1760, 0.5, { vol: 0.11 }); this.tone(2637, 0.4, { vol: 0.05, at: 0.05 }); },
    tick() { this.tone(988, 0.08, { type: 'triangle', vol: 0.05 }); },
    stage() { this.tone(784, 0.12, { type: 'triangle', vol: 0.07 }); this.tone(1175, 0.2, { type: 'triangle', vol: 0.07, at: 0.1 }); },
    heart() { this.tone(82, 0.18, { vol: 0.45, to: 44 }); this.tone(82, 0.16, { vol: 0.3, to: 44, at: 0.2 }); },
    fanfare() {
      const n = [523.25, 659.25, 783.99, 1046.5];
      n.forEach((f, i) => { this.tone(f, 0.22, { type: 'square', vol: 0.06, at: i * 0.11 }); this.tone(f * 2, 0.2, { vol: 0.04, at: i * 0.11 }); });
      n.forEach((f) => this.tone(f, 1.3, { type: 'triangle', vol: 0.07, at: 0.48, atk: 0.02 }));
      this.noise(1.3, { type: 'highpass', freq: 6000, vol: 0.05, at: 0.48 });
    },
  };

  // ---------- course ----------
  let statics = [], dyns = [], sBands = [], dBands = [], bumpers = [], gate = null;
  function index(o, bands, y0, y1) {
    const b0 = Math.max(0, Math.floor((y0 - 30) / BAND)), b1 = Math.floor((y1 + 30) / BAND);
    for (let b = b0; b <= b1; b++) (bands[b] || (bands[b] = [])).push(o);
  }
  function seg(ax, ay, bx, by, o) {
    o = o || {};
    const s = { t: 'seg', ax, ay, bx, by, hw: o.hw || 5, e: o.e == null ? 0.45 : o.e, gate: !!o.gate, active: true, openAt: 0 };
    statics.push(s); index(s, sBands, Math.min(ay, by) - s.hw, Math.max(ay, by) + s.hw);
    return s;
  }
  function pin(x, y, R) { const p = { t: 'pin', x, y, R, e: 0.5 }; statics.push(p); index(p, sBands, y - R, y + R); }
  function bumper(x, y, R) { const b = { t: 'bump', x, y, R, flash: 0 }; statics.push(b); bumpers.push(b); index(b, sBands, y - R, y + R); }
  function rotor(cx, cy, R, arms, omega) {
    const r = { t: 'rot', cx, cy, R, arms, omega, om0: omega, angle: 0, hw: 5, hubR: 11, tx: [], ty: [] };
    for (let k = 0; k < arms; k++) { r.tx.push(cx); r.ty.push(cy); }
    dyns.push(r); index(r, dBands, cy - R - 5, cy + R + 5);
  }
  function slider(y, half, amp, omega) {
    const s = { t: 'sld', y, half, amp, omega, om0: omega, phase: 0, base: W / 2, cx: W / 2, vx: 0, hw: 6 };
    dyns.push(s); index(s, dBands, y - 6, y + 6);
  }

  function buildCourse() {
    statics = []; dyns = []; sBands = []; dBands = []; bumpers = [];
    seg(0, 16, W, 16, { hw: 4 });
    gate = seg(0, 272, W, 272, { hw: 6, gate: true });

    // 02 핀 폭포
    for (let row = 0; row < 19; row++) {
      const y = 340 + row * 52, odd = row % 2 === 1;
      for (let k = 0; k < (odd ? 14 : 13); k++) pin((odd ? 36 : 64) + k * 56, y, 5);
      if (!odd) { seg(0, y - 12, 30, y + 6, { hw: 3 }); seg(W, y - 12, W - 30, y + 6, { hw: 3 }); }
    }

    // 03 풍차 언덕
    rotor(200, 1480, 150, 4, 2.0);
    rotor(600, 1480, 150, 4, -2.0);
    pin(400, 1480, 9);
    rotor(400, 1780, 165, 3, 1.5);
    rotor(90, 1780, 58, 2, -3.2);
    rotor(710, 1780, 58, 2, 3.2);
    rotor(220, 2110, 140, 4, -2.2);
    rotor(580, 2110, 140, 4, 2.2);

    // 04 지그재그 슬로프
    for (let i = 0; i < 6; i++) {
      const y = 2330 + i * 190;
      if (i % 2 === 0) { seg(0, y, 620, y + 130, { hw: 6, e: 0.3 }); rotor(720, y + 120, 40, 2, 4.2); }
      else { seg(W, y, 180, y + 130, { hw: 6, e: 0.3 }); rotor(80, y + 120, 40, 2, -4.2); }
    }

    const Z = 380; // 슬로프 아래 구간은 슬로프 두 단 높이만큼 내려간다
    // 05 범퍼 지옥
    [3150, 3290, 3430, 3570].map((y) => y + Z).forEach((y, i) => {
      (i % 2 ? [220, 460, 700] : [100, 340, 580]).forEach((x) => bumper(x, y, 30));
      pin(i % 2 ? 44 : 756, y, 7);
    });

    // 06 흔들 다리
    [3720, 3870, 4020, 4170].forEach((y, i) => slider(y + Z, 150, 210, [1.5, 1.9, 1.3, 2.2][i]));
    pin(400, 3795 + Z, 7); pin(200, 3945 + Z, 7); pin(600, 3945 + Z, 7); pin(400, 4095 + Z, 7);

    // 07 죽음의 깔때기
    seg(0, 4330 + Z, 320, 4800 + Z, { hw: 6, e: 0.3 });
    seg(W, 4330 + Z, 480, 4800 + Z, { hw: 6, e: 0.3 });
    rotor(400, 4900 + Z, 70, 4, 3.4);

    // 08 마지막 직선
    for (let k = 0; k < 9; k++) pin(80 + k * 80, 5080 + Z, 6);
    for (let k = 0; k < 10; k++) pin(40 + k * 80, 5150 + Z, 6);
    rotor(250, 5300 + Z, 90, 2, -2.6);
    rotor(550, 5300 + Z, 90, 2, 2.6);
    for (let k = 0; k < 9; k++) pin(80 + k * 80, 5450 + Z, 6);
    for (let k = 0; k < 10; k++) pin(40 + k * 80, 5530 + Z, 6);

    // 도착 바구니
    seg(0, 5905 + Z, 400, 5945 + Z, { hw: 6, e: 0.2 });
    seg(W, 5905 + Z, 400, 5945 + Z, { hw: 6, e: 0.2 });

  function randomizeCourse() {
    for (const d of dyns) {
      d.omega = d.om0 * rand(0.85, 1.15);
      if (d.t === 'rot') d.angle = rand(0, TAU); else d.phase = rand(0, TAU);
    }
    updateDyn(0, S.simT);
  }

  function updateDyn(h, t) {
    for (const d of dyns) {
      if (d.t === 'rot') {
        d.angle = (d.angle + d.omega * h) % TAU;
        for (let k = 0; k < d.arms; k++) {
          const a = d.angle + (k * TAU) / d.arms;
          d.tx[k] = d.cx + Math.cos(a) * d.R; d.ty[k] = d.cy + Math.sin(a) * d.R;
        }
      } else {
        const ph = d.omega * t + d.phase;
        d.cx = d.base + d.amp * Math.sin(ph);
        d.vx = d.amp * d.omega * Math.cos(ph);
      }
    }
  }

  // ---------- physics ----------
  let hitNx = 0, hitNy = 0;
  function hitSeg(m, ax, ay, bx, by, hw, e, pcx, pcy, om, lvx) {
    const abx = bx - ax, aby = by - ay, l2 = abx * abx + aby * aby || 1;
    let t = ((m.x - ax) * abx + (m.y - ay) * aby) / l2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const px = ax + abx * t, py = ay + aby * t;
    let nx = m.x - px, ny = m.y - py;
    const rr = m.r + hw, d2 = nx * nx + ny * ny;
    if (d2 >= rr * rr) return 0;
    let d = Math.sqrt(d2);
    if (d < 1e-6) {
      const l = Math.sqrt(l2); nx = -aby / l; ny = abx / l;
      if (ny > 0) { nx = -nx; ny = -ny; }
      d = 0;
    } else { nx /= d; ny /= d; }
    m.x += nx * (rr - d); m.y += ny * (rr - d);
    const svx = lvx - om * (py - pcy), svy = om * (px - pcx);
    const rvx = m.vx - svx, rvy = m.vy - svy, vn = rvx * nx + rvy * ny;
    if (vn >= 0) return 0;
    const imp = -vn, bounce = imp > 70 ? e : 0, fr = imp > 70 ? 0.985 : 0.9995;
    m.vx = svx + (rvx - vn * nx) * fr - bounce * vn * nx;
    m.vy = svy + (rvy - vn * ny) * fr - bounce * vn * ny;
    return imp;
  }
  function hitCircle(m, cx, cy, R, e) {
    let nx = m.x - cx, ny = m.y - cy;
    const rr = m.r + R, d2 = nx * nx + ny * ny;
    if (d2 >= rr * rr) return 0;
    let d = Math.sqrt(d2);
    if (d < 1e-6) { nx = 0; ny = -1; d = 0; } else { nx /= d; ny /= d; }
    m.x += nx * (rr - d); m.y += ny * (rr - d);
    hitNx = nx; hitNy = ny;
    const vn = m.vx * nx + m.vy * ny;
    if (vn >= 0) return 0;
    const imp = -vn, bounce = imp > 70 ? e : 0, fr = imp > 70 ? 0.985 : 0.9995;
    m.vx = (m.vx - vn * nx) * fr - bounce * vn * nx;
    m.vy = (m.vy - vn * ny) * fr - bounce * vn * ny;
    return imp;
  }
  function collide(m, o) {
    let i;
    switch (o.t) {
      case 'seg':
        if (!o.active) return;
        i = hitSeg(m, o.ax, o.ay, o.bx, o.by, o.hw, o.e, 0, 0, 0, 0);
        if (i > 150) onHit('seg', m, i);
        return;
      case 'pin':
        i = hitCircle(m, o.x, o.y, o.R, o.e);
        if (i > 150) onHit('pin', m, i);
        return;
      case 'bump': {
        i = hitCircle(m, o.x, o.y, o.R, 0.9);
        if (i > 0) {
          const out = Math.max(i * 0.95, 620), vn = m.vx * hitNx + m.vy * hitNy;
          m.vx += (out - vn) * hitNx; m.vy += (out - vn) * hitNy;
          o.flash = 1; onHit('bump', m, i);
        }
        return;
      }
      case 'rot': {
        const dx = m.x - o.cx, dy = m.y - o.cy, lim = o.R + o.hw + m.r;
        if (dx * dx + dy * dy > lim * lim) return;
        let best = hitCircle(m, o.cx, o.cy, o.hubR, 0.4);
        for (let k = 0; k < o.arms; k++) {
          const v = hitSeg(m, o.cx, o.cy, o.tx[k], o.ty[k], o.hw, 0.45, o.cx, o.cy, o.omega, 0);
          if (v > best) best = v;
        }
        if (best > 170) onHit('rot', m, best);
        return;
      }
      case 'sld':
        if (Math.abs(m.y - o.y) > o.hw + m.r) return;
        i = hitSeg(m, o.cx - o.half, o.y, o.cx + o.half, o.y, o.hw, 0.3, 0, 0, 0, o.vx);
        if (i > 170) onHit('sld', m, i);
    }
  }
  let viewY0 = 0, viewY1 = 0, shake = 0, flash = 0;
  function onHit(kind, m, imp) {
    if (m.y < viewY0 || m.y > viewY1) return;
    if (kind === 'bump') { Snd.boing(); if (!reduced) shake = Math.min(9, shake + 3.5); }
    else if (kind === 'rot' || kind === 'sld') Snd.thud(imp);
    else Snd.pin(imp);
  }

  const order = [];
  const byY = (a, b) => a.y - b.y;
  function step(h) {
    S.simT += h;
    if (S.phase === 'racing' || S.phase === 'done') S.raceTime += h;
    updateDyn(h, S.simT);
    const n = marbles.length;
    for (let i = 0; i < n; i++) {
      const m = marbles[i];
      m.vy += GRAV * h;
      const v2 = m.vx * m.vx + m.vy * m.vy;
      if (v2 > VMAX * VMAX) { const k = VMAX / Math.sqrt(v2); m.vx *= k; m.vy *= k; }
      m.x += m.vx * h; m.y += m.vy * h;
    }
    order.length = n;
    for (let i = 0; i < n; i++) order[i] = marbles[i];
    order.sort(byY);
    for (let i = 0; i < n; i++) {
      const a = order[i];
      for (let j = i + 1; j < n; j++) {
        const b = order[j], rr = a.r + b.r, dy = b.y - a.y;
        if (dy >= rr) break;
        let dx = b.x - a.x;
        if (dx >= rr || dx <= -rr) continue;
        let d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        if (d2 < 1e-8) { dx = 0.01; d2 = 1e-4; }
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, pen = (rr - d) * 0.5;
        a.x -= nx * pen; a.y -= ny * pen; b.x += nx * pen; b.y += ny * pen;
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) {
          const jm = -(1 + (vn < -80 ? 0.55 : 0.05)) * vn * 0.5;
          a.vx -= jm * nx; a.vy -= jm * ny; b.vx += jm * nx; b.vy += jm * ny;
        }
      }
    }
    for (let i = 0; i < n; i++) {
      const m = marbles[i], b = m.y > 0 ? (m.y / BAND) | 0 : 0;
      let L = dBands[b];
      if (L) for (let j = 0; j < L.length; j++) collide(m, L[j]);
      L = sBands[b];
      if (L) for (let j = 0; j < L.length; j++) collide(m, L[j]);
      if (m.x < m.r) { m.x = m.r; if (m.vx < 0) m.vx *= -0.4; }
      else if (m.x > W - m.r) { m.x = W - m.r; if (m.vx > 0) m.vx *= -0.4; }
      if (m.y > WORLD_H - m.r) { m.y = WORLD_H - m.r; if (m.vy > 0) m.vy = 0; }
      else if (m.y < m.r) { m.y = m.r; if (m.vy < 0) m.vy = 0; }
      if (!m.fin && m.y > FINISH_Y) onFinish(m);
    }
  }

  // ---------- marbles ----------
  function spawnMarbles() {
    const list = [];
    S.participants.forEach((p, pi) => { for (let k = 0; k < p.weight; k++) list.push({ pi, k, name: p.name, multi: p.weight > 1 }); });
    shuffle(list);
    const n = list.length;
    const r = n > 120 ? 7 : n > 64 ? 8.5 : 10;
    const sp = r * 2 + 5;
    const cols = Math.max(1, Math.floor((W - 40) / sp));
    const x0 = (W - cols * sp) / 2 + sp / 2;
    marbles = list.map((it, i) => {
      const col = i % cols, row = (i / cols) | 0;
      return {
        id: i, pi: it.pi, name: it.name, tag: it.multi ? it.name + ' #' + (it.k + 1) : it.name,
        color: colorOf(it.pi), dark: darkOf(it.pi),
        x: x0 + col * sp + rand(-2, 2), y: 52 + row * sp + rand(0, 4), vx: rand(-30, 30), vy: 0, r,
        fin: false, ft: 0, won: false, rank: 0, trail: [], ck: { x: 0, y: 0, t: 0 }, kick: 0,
      };
    });
    S.follow = null;
  }

  // ---------- race flow ----------
  function startRace() {
    if (S.phase !== 'idle') return;
    if (S.participants.length < 2) { setMsg('참가자를 2명 이상 넣어 주세요.'); return; }
    hideResult();
    Object.assign(S, {
      phase: 'countdown', cdT: 0, cdBeat: -1, raceTime: 0, endTime: 0, follow: null, manual: null,
      winnerNames: new Set(), winnerList: [], finishOrder: [], sectionIdx: 0,
      leadName: null, leadCand: null, leadCandT: 0, leadToastT: -9,
      decisive: null, decisiveOn: false, finalShown: false, slowHold: 0,
    });
    el.feed.innerHTML = '';
    el.panel.scrollTop = 0;
    buildRankRows();
    setPhaseUI();
    updateRanking();
  }

  function resetIdle() {
    clearTimeout(S.resultTimer);
    hideResult();
    Object.assign(S, { phase: 'idle', timeScale: 1, follow: null, manual: null, raceTime: 0, endTime: 0, decisive: null, decisiveOn: false, slowHold: 0 });
    gate.active = true;
    confetti.length = 0; flash = 0;
    el.banner.innerHTML = ''; el.feed.innerHTML = '';
    randomizeCourse();
    renderChips(); renderSettings();
    spawnMarbles();
    setPhaseUI();
    el.panel.scrollTop = 0;
  }

  function phaseTick(dt) {
    if (S.phase !== 'countdown') return;
    S.cdT += dt;
    const beat = Math.floor(S.cdT / 0.8);
    if (beat === S.cdBeat) return;
    S.cdBeat = beat;
    if (beat < 3) {
      showBanner(String(3 - beat), 'count', 560);
      Snd.beep(false);
      for (const m of marbles) { m.vy = -rand(220, 480); m.vx += rand(-200, 200); }
    } else {
      showBanner('GO!', 'count launch', 650);
      Snd.beep(true); Snd.whoosh();
      gate.active = false; gate.openAt = performance.now();
      S.phase = 'racing'; S.raceTime = 0;
      for (const m of marbles) { m.ck.x = m.x; m.ck.y = m.y; m.ck.t = S.simT; }
      setPhaseUI();
    }
  }

  function onFinish(m) {
    m.fin = true; m.ft = S.raceTime;
    S.finishOrder.push(m);
    const prev = S.finishOrder[S.finishOrder.length - 2];
    if (S.mode === 'first' && prev && prev.won && m.ft - prev.ft < 0.15 && prev.name !== m.name) {
      toast('<b>간발의 차!</b> ' + nameTag(m) + ' +' + (m.ft - prev.ft).toFixed(2) + 's', 'hot');
    }
    if (S.phase !== 'racing') return;
    if (S.mode === 'first') {
      if (!S.winnerNames.has(m.name) && S.winnerNames.size < S.winners) {
        S.winnerNames.add(m.name); m.won = true; S.winnerList.push(m);
        Snd.ding();
        toast('<b>' + S.winnerList.length + '등</b> ' + nameTag(m) + ' 결승 통과 · ' + m.ft.toFixed(2) + 's', 'gold');
        if (S.winnerNames.size >= S.winners) endRace();
      } else Snd.tick();
    } else {
      Snd.tick();
      const left = new Set();
      for (const x of marbles) if (!x.fin) left.add(x.name);
      if (!left.has(m.name) && left.size <= S.winners + 5) toast(nameTag(m) + ' 탈출 성공 · 남은 ' + left.size + '명', left.size <= S.winners + 1 ? 'hot' : '');
      if (left.size <= S.winners) {
        for (const name of left) {
          let rep = null;
          for (const x of marbles) if (!x.fin && x.name === name && (!rep || x.y < rep.y)) rep = x;
          rep.won = true; rep.gap = meters(rep.y); S.winnerList.push(rep); S.winnerNames.add(name);
        }
        endRace();
      }
    }
  }

  function endRace() {
    S.phase = 'done'; S.endTime = S.raceTime; S.slowHold = 1.4; S.follow = null;
    flash = 1; shake = reduced ? 0 : 10;
    Snd.fanfare();
    burst();
    showBanner('당첨!', 'count', 1300);
    setPhaseUI();
    updateRanking();
    clearTimeout(S.resultTimer);
    S.resultTimer = setTimeout(showResult, 1800);
  }

  function decisive() {
    const zone = FINISH_Y - 420;
    if (S.mode === 'first') {
      if (S.winnerNames.size !== S.winners - 1) return null;
      return S.leader && S.leader.y > zone ? S.leader : null;
    }
    if (S.remain.size !== S.winners + 1) return null;
    return S.front && S.front.y > zone ? S.front : null;
  }

  function tempo(dt) {
    let target = 1;
    const d = S.phase === 'racing' ? decisive() : null;
    S.decisive = d;
    if (d) {
      target = 0.3;
      if (!S.decisiveOn) {
        S.decisiveOn = true; S.heartT = 0;
        if (!S.finalShown) { S.finalShown = true; showBanner('결승 임박!', 'hot', 900); }
      }
      S.heartT -= dt;
      if (S.heartT <= 0) { Snd.heart(); S.heartT = 0.8; }
    } else {
      S.decisiveOn = false;
      if (S.phase === 'done' && S.slowHold > 0) { S.slowHold -= dt; target = 0.35; }
    }
    const rate = target < S.timeScale ? 6 : 1.6;
    S.timeScale += (target - S.timeScale) * (1 - Math.exp(-dt * rate));
  }

  function afterSim(dt) {
    let front = null, back = null, lead = null;
    S.remain.clear();
    for (const m of marbles) {
      if (m.fin) continue;
      S.remain.add(m.name);
      if (!front || m.y > front.y) front = m;
      if (!back || m.y < back.y) back = m;
      if (!S.winnerNames.has(m.name) && (!lead || m.y > lead.y)) lead = m;
    }
    S.front = front; S.back = back; S.leader = lead;

    if (S.phase === 'racing' || S.phase === 'done') {
      for (const m of marbles) {
        if (m.kick > 0) m.kick -= dt;
        if (m.fin) { if (m.trail.length) m.trail.length = 0; continue; }
        m.trail.push(m.x, m.y);
        if (m.trail.length > 20) m.trail.splice(0, 2);
        if (S.simT - m.ck.t > 1.5) {
          const dx = m.x - m.ck.x, dy = m.y - m.ck.y;
          if (dx * dx + dy * dy < 196) { m.vy = -rand(260, 520); m.vx = rand(-380, 380); m.kick = 0.6; }
          m.ck.x = m.x; m.ck.y = m.y; m.ck.t = S.simT;
        }
      }
    }
    if (S.phase === 'racing') {
      if (front) {
        let idx = 0;
        for (let i = 0; i < SECTIONS.length; i++) if (front.y >= SECTIONS[i].y) idx = i;
        if (idx > S.sectionIdx) {
          S.sectionIdx = idx;
          toast('<b>STAGE ' + (idx + 1) + '</b> ' + esc(SECTIONS[idx].name) + ' 진입');
          Snd.stage();
        }
      }
      if (S.mode === 'first' && lead) {
        if (S.leadName === null) S.leadName = lead.name;
        else if (lead.name !== S.leadName) {
          if (S.leadCand !== lead.name) { S.leadCand = lead.name; S.leadCandT = S.raceTime; }
          else if (S.raceTime - S.leadCandT > 0.6) {
            S.leadName = lead.name; S.leadCand = null;
            if (S.raceTime > 4 && S.raceTime - S.leadToastT > 3 && !S.decisiveOn) {
              S.leadToastT = S.raceTime;
              toast('<b>역전!</b> ' + nameTag(lead) + ' 선두로', 'hot');
            }
          }
        } else S.leadCand = null;
      }
    }
    for (const b of bumpers) if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 3);
    shake *= Math.exp(-dt * 7);
    flash = Math.max(0, flash - dt * 1.4);
  }

  // ---------- camera ----------
  const cam = { x: W / 2, y: 0, zoom: 1, wide: 1 };
  let cw = 1, ch = 1, dpr = 1;
  function miniSpace() { return el.mini.offsetWidth + 18; }
  function layout() {
    // Narrow screens show the whole width while waiting, then zoom in to follow the race.
    const usable = Math.max(100, cw - miniSpace());
    const full = usable / (W + 64), follow = full < 0.66 ? Math.min(0.66, usable / 470) : full;
    const s = Math.min(follow + (full - follow) * cam.wide, ch / 560) * cam.zoom;
    return { s, cx0: usable / 2, cy0: ch / 2, vw: usable / s, vh: ch / s };
  }
  function camBounds(L) {
    const xr = L.vw >= W + 40 ? [W / 2, W / 2] : [L.vw / 2 - 20, W - L.vw / 2 + 20];
    return { x0: xr[0], x1: xr[1], y0: L.vh / 2 - 24, y1: WORLD_H - L.vh / 2 + 24 };
  }
  function camTarget() {
    if (S.follow != null && marbles[S.follow]) return marbles[S.follow];
    if (S.phase === 'done') return S.winnerList[S.winnerList.length - 1] || S.front;
    if (S.decisive) return S.decisive;
    return S.mode === 'first' ? (S.leader || S.front) : (S.back || S.front);
  }
  function updateCamera(dt) {
    let L = layout();
    let tx = cam.x, ty = 0, tz = 1, fast = false;
    if (S.manual && performance.now() < S.manual.until) { tx = S.manual.x; ty = S.manual.y; fast = true; }
    else {
      S.manual = null;
      if (S.phase === 'racing' || S.phase === 'done') {
        const t = camTarget();
        if (t) { tx = t.x; ty = t.y + clamp(t.vy * 0.25, -200, 300) + L.vh * 0.08; }
        if (S.timeScale < 0.8) tz = 1.35;
      } else { tx = W / 2; ty = 0; }
    }
    cam.zoom += (tz - cam.zoom) * (1 - Math.exp(-dt * 2.5));
    cam.wide += ((S.phase === 'idle' || S.phase === 'countdown' ? 1 : 0) - cam.wide) * (1 - Math.exp(-dt * 2));
    L = layout();
    const B = camBounds(L);
    tx = clamp(tx, B.x0, B.x1); ty = clamp(ty, B.y0, B.y1);
    const k = 1 - Math.exp(-dt * (fast ? 12 : 4.5));
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
    cam.x = clamp(cam.x, B.x0, B.x1); cam.y = clamp(cam.y, B.y0, B.y1);
  }
  function manualTo(x, y) {
    const B = camBounds(layout());
    const racing = S.phase === 'racing' || S.phase === 'countdown';
    S.manual = { x: clamp(x, B.x0, B.x1), y: clamp(y, B.y0, B.y1), until: racing ? performance.now() + 2800 : Infinity };
  }
  function manualPan(dx, dy) {
    const base = S.manual || cam;
    manualTo(base.x + dx, base.y + dy);
  }

  // ---------- rendering ----------
  const dotPattern = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 28;
    const g = c.getContext('2d'); g.globalAlpha = 0.09; g.fillStyle = C.chrome;
    g.beginPath(); g.arc(14, 14, 1.3, 0, TAU); g.fill();
    return ctx.createPattern(c, 'repeat');
  })();
  function rrect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  let frameNo = 0, lastOx = 0, lastOy = 0, lastS = 1;
  function render(dt) {
    frameNo++;
    const L = layout();
    const shx = shake > 0.3 ? (Math.random() - 0.5) * shake : 0, shy = shake > 0.3 ? (Math.random() - 0.5) * shake : 0;
    const ox = L.cx0 - cam.x * L.s + shx, oy = L.cy0 - cam.y * L.s + shy;
    lastOx = ox; lastOy = oy; lastS = L.s;
    viewY0 = -oy / L.s; viewY1 = (ch - oy) / L.s;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.cabinet; ctx.fillRect(0, 0, cw, ch);
    ctx.setTransform(dpr * L.s, 0, 0, dpr * L.s, dpr * ox, dpr * oy);
    drawField(viewY0, viewY1);
    drawObjects(viewY0, viewY1);
    drawMarbles(viewY0, viewY1);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawLabels(L, ox, oy);
    drawOverlay(dt);
    drawMini();
  }

  function drawField(y0, y1) {
    const top = Math.max(-60, y0), bot = Math.min(WORLD_H + 60, y1);
    ctx.fillStyle = C.field; ctx.fillRect(0, top, W, bot - top);
    for (let i = 1; i < SECTIONS.length; i += 2) {
      const a = SECTIONS[i].y, b = i + 1 < SECTIONS.length ? SECTIONS[i + 1].y : FINISH_Y;
      if (b < y0 || a > y1) continue;
      ctx.fillStyle = C['field-2']; ctx.fillRect(0, a, W, b - a);
    }
    if (FINISH_Y < bot) { ctx.globalAlpha = 0.08; ctx.fillStyle = C.win; ctx.fillRect(0, FINISH_Y, W, WORLD_H - FINISH_Y); ctx.globalAlpha = 1; }
    ctx.fillStyle = dotPattern; ctx.fillRect(0, top, W, bot - top);

    ctx.textBaseline = 'top'; ctx.textAlign = 'left'; ctx.fillStyle = C.ink;
    for (let i = 0; i < SECTIONS.length; i++) {
      const y = SECTIONS[i].y + 22;
      if (y > y1 || y + 180 < y0) continue;
      ctx.globalAlpha = 0.08;
      ctx.font = '400 120px "Black Han Sans", sans-serif';
      ctx.fillText(String(i + 1).padStart(2, '0'), 20, y);
      ctx.globalAlpha = 0.12;
      ctx.font = '400 38px "Black Han Sans", sans-serif';
      ctx.fillText(SECTIONS[i].name, 24, y + 122);
    }
    ctx.globalAlpha = 1;

    if (FINISH_Y + 40 > y0 && FINISH_Y - 80 < y1) {
      const sq = 16;
      for (let x = 0, i = 0; x < W; x += sq, i++) {
        for (let r = 0; r < 2; r++) { ctx.fillStyle = (i + r) % 2 ? C.ink : C.cabinet; ctx.fillRect(x, FINISH_Y - sq + r * sq, sq, sq); }
      }
      ctx.fillStyle = C.win; ctx.font = '700 30px "Chakra Petch", sans-serif'; ctx.textBaseline = 'bottom';
      ctx.fillText('FINISH', 22, FINISH_Y - 24);
      ctx.textAlign = 'right'; ctx.font = '500 18px "Chakra Petch", sans-serif'; ctx.fillStyle = C['rail-hi'];
      ctx.fillText((FINISH_Y / PX_PER_M).toFixed(1) + ' m', W - 22, FINISH_Y - 26);
    }
    ctx.fillStyle = C.rail; ctx.fillRect(-10, top, 10, bot - top); ctx.fillRect(W, top, 10, bot - top);
    ctx.fillStyle = C['rail-hi']; ctx.globalAlpha = 0.6; ctx.fillRect(-4, top, 2, bot - top); ctx.fillRect(W + 2, top, 2, bot - top); ctx.globalAlpha = 1;
  }

  function drawObjects(y0, y1) {
    const b0 = Math.max(0, Math.floor(y0 / BAND)), b1 = Math.floor(y1 / BAND);
    const segs = [], pins = [], bumps = [], rots = [], slds = [];
    for (let b = b0; b <= b1; b++) {
      const A = sBands[b];
      if (A) for (const o of A) if (o._f !== frameNo) { o._f = frameNo; (o.t === 'seg' ? segs : o.t === 'pin' ? pins : bumps).push(o); }
      const D = dBands[b];
      if (D) for (const o of D) if (o._f !== frameNo) { o._f = frameNo; (o.t === 'rot' ? rots : slds).push(o); }
    }
    ctx.lineCap = 'round';
    for (const o of slds) {
      ctx.globalAlpha = 0.18; ctx.strokeStyle = C.chrome; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
      ctx.beginPath(); ctx.moveTo(o.base - o.amp - o.half, o.y); ctx.lineTo(o.base + o.amp + o.half, o.y); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    for (const o of rots) {
      ctx.globalAlpha = 0.06; ctx.fillStyle = C.chrome;
      ctx.beginPath(); ctx.arc(o.cx, o.cy, o.R, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const o of segs) {
      if (o.gate) { drawGate(o); continue; }
      ctx.strokeStyle = C.rail; ctx.lineWidth = o.hw * 2;
      ctx.beginPath(); ctx.moveTo(o.ax, o.ay); ctx.lineTo(o.bx, o.by); ctx.stroke();
    }
    ctx.strokeStyle = C['rail-hi']; ctx.globalAlpha = 0.6; ctx.lineWidth = 2; ctx.beginPath();
    for (const o of segs) if (!o.gate) { ctx.moveTo(o.ax, o.ay - o.hw * 0.35); ctx.lineTo(o.bx, o.by - o.hw * 0.35); }
    ctx.stroke(); ctx.globalAlpha = 1;

    ctx.fillStyle = C.chrome; ctx.beginPath();
    for (const o of pins) { ctx.moveTo(o.x + o.R, o.y); ctx.arc(o.x, o.y, o.R, 0, TAU); }
    ctx.fill();
    ctx.fillStyle = C.cabinet; ctx.globalAlpha = 0.35; ctx.beginPath();
    for (const o of pins) { ctx.moveTo(o.x + o.R * 0.45 + o.R * 0.3, o.y + o.R * 0.3); ctx.arc(o.x + o.R * 0.3, o.y + o.R * 0.3, o.R * 0.45, 0, TAU); }
    ctx.fill(); ctx.globalAlpha = 1;

    for (const o of bumps) {
      const f = o.flash;
      if (f > 0) {
        ctx.globalAlpha = f * 0.7; ctx.strokeStyle = C.hot; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(o.x, o.y, o.R + 6 + (1 - f) * 16, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
      }
      ctx.fillStyle = C.hot; ctx.beginPath(); ctx.arc(o.x, o.y, o.R + f * 3, 0, TAU); ctx.fill();
      ctx.fillStyle = C.cabinet; ctx.beginPath(); ctx.arc(o.x, o.y, o.R * 0.7, 0, TAU); ctx.fill();
      ctx.fillStyle = f > 0.05 ? C.win : C.rail; ctx.beginPath(); ctx.arc(o.x, o.y, o.R * 0.38, 0, TAU); ctx.fill();
    }

    for (const o of slds) {
      ctx.strokeStyle = C.rail; ctx.lineWidth = o.hw * 2;
      ctx.beginPath(); ctx.moveTo(o.cx - o.half, o.y); ctx.lineTo(o.cx + o.half, o.y); ctx.stroke();
      ctx.strokeStyle = C.cabinet; ctx.lineWidth = 3; ctx.globalAlpha = 0.5; ctx.beginPath();
      for (let x = -o.half + 14; x < o.half - 8; x += 22) { ctx.moveTo(o.cx + x, o.y + 3); ctx.lineTo(o.cx + x + 8, o.y - 3); }
      ctx.stroke(); ctx.globalAlpha = 1;
    }
    for (const o of rots) {
      ctx.strokeStyle = C.chrome; ctx.lineWidth = o.hw * 2; ctx.beginPath();
      for (let k = 0; k < o.arms; k++) { ctx.moveTo(o.cx, o.cy); ctx.lineTo(o.tx[k], o.ty[k]); }
      ctx.stroke();
      ctx.fillStyle = C.hot; ctx.beginPath(); ctx.arc(o.cx, o.cy, o.hubR, 0, TAU); ctx.fill();
      ctx.fillStyle = C.cabinet; ctx.beginPath(); ctx.arc(o.cx, o.cy, o.hubR * 0.42, 0, TAU); ctx.fill();
    }
  }

  function drawGate(o) {
    let p = 0;
    if (!o.active) { p = Math.min(1, (performance.now() - o.openAt) / 380); if (p >= 1) return; }
    const off = p * (W / 2);
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = C.hot; ctx.lineWidth = o.hw * 2; ctx.beginPath();
    ctx.moveTo(o.ax - off, o.ay); ctx.lineTo(W / 2 - off, o.ay); ctx.moveTo(W / 2 + off, o.ay); ctx.lineTo(o.bx + off, o.by);
    ctx.stroke();
    ctx.strokeStyle = C.win; ctx.lineWidth = 3; ctx.setLineDash([16, 14]); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawMarbles(y0, y1) {
    ctx.lineCap = 'round';
    for (const m of marbles) {
      if (m.y < y0 - 80 || m.y > y1 + 80) continue;
      const tr = m.trail;
      if (tr.length < 6) continue;
      ctx.strokeStyle = m.color; ctx.lineWidth = m.r * 1.15;
      for (let i = 2; i < tr.length; i += 2) {
        ctx.globalAlpha = (i / tr.length) * 0.26;
        ctx.beginPath(); ctx.moveTo(tr[i - 2], tr[i - 1]); ctx.lineTo(tr[i], tr[i + 1]); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    const now = performance.now() / 1000;
    for (const m of marbles) {
      if (m.y < y0 - 20 || m.y > y1 + 20) continue;
      const g = ctx.createRadialGradient(m.x - m.r * 0.38, m.y - m.r * 0.42, m.r * 0.12, m.x, m.y, m.r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, m.color); g.addColorStop(1, m.dark);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, TAU); ctx.fill();
      if (m.won) {
        ctx.strokeStyle = C.win; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r + 4 + Math.sin(now * 8) * 1.5, 0, TAU); ctx.stroke();
      }
      if (m.id === S.follow) {
        ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r + 7 + Math.sin(now * 6) * 2, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
      }
      if (m.kick > 0) {
        ctx.strokeStyle = C.hot; ctx.lineWidth = 2; ctx.globalAlpha = m.kick / 0.6;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r + (0.6 - m.kick) * 40, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
  }

  // Labels are placed greedily: highlighted pills first, then plain names, each nudged up a row
  // or dropped when it would cover another label.
  const placed = [];
  function claim(x, y, w, h, rowsUp) {
    for (let t = 0; t <= rowsUp; t++) {
      const yy = y - t * (h + 2);
      let free = true;
      for (let i = 0; i < placed.length; i += 4) {
        if (x < placed[i] + placed[i + 2] && x + w > placed[i] && yy < placed[i + 1] + placed[i + 3] && yy + h > placed[i + 1]) { free = false; break; }
      }
      if (free) { placed.push(x, yy, w, h); return yy; }
    }
    return null;
  }
  function drawLabels(L, ox, oy) {
    const vis = [];
    for (const m of marbles) {
      const sy = oy + m.y * L.s; if (sy < -30 || sy > ch + 30) continue;
      const sx = ox + m.x * L.s; if (sx < -60 || sx > cw + 60) continue;
      vis.push(m, sx, sy);
    }
    placed.length = 0;
    const edge = cw - miniSpace();
    const fit = (x, w) => clamp(x, 4, Math.max(4, edge - w - 4));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.font = '700 13px "IBM Plex Sans KR", sans-serif';
    for (let i = 0; i < vis.length; i += 3) {
      const m = vis[i];
      if (!(m.won || m.id === S.follow || S.hot.has(m.id))) continue;
      const text = (m.won ? '★ ' : '') + m.name;
      const w = ctx.measureText(text).width + 16, h = 22;
      const x = fit(vis[i + 1] - w / 2, w);
      const y = claim(x, vis[i + 2] - m.r * L.s - 8 - h, w, h, 2);
      if (y === null) continue;
      ctx.fillStyle = m.won ? C.win : m.color; rrect(ctx, x, y, w, h, 11); ctx.fill();
      ctx.fillStyle = C.cabinet; ctx.fillText(text, x + w / 2, y + h / 2 + 0.5);
    }
    const count = vis.length / 3;
    if (count > 90) return;
    const small = count > 26, h = small ? 13 : 15;
    ctx.font = '600 ' + (small ? 10 : 12) + 'px "IBM Plex Sans KR", sans-serif';
    ctx.lineWidth = 3; ctx.strokeStyle = C.cabinet; ctx.fillStyle = C.ink;
    ctx.globalAlpha = small ? 0.8 : 0.95;
    for (let i = 0; i < vis.length; i += 3) {
      const m = vis[i];
      if (m.won || m.id === S.follow || S.hot.has(m.id)) continue;
      const w = ctx.measureText(m.name).width + 4;
      const x = fit(vis[i + 1] - w / 2, w);
      const y = claim(x, vis[i + 2] - m.r * L.s - 3 - h, w, h, 2);
      if (y === null) continue;
      ctx.strokeText(m.name, x + w / 2, y + h / 2); ctx.fillText(m.name, x + w / 2, y + h / 2);
    }
    ctx.globalAlpha = 1;
  }

  const confetti = [];
  function burst() {
    const n = reduced ? 40 : 170;
    const cols = [C.win, C.hot, C.chrome, C['rail-hi']].concat(S.winnerList.map((m) => m.color));
    const right = cw - miniSpace();
    for (let i = 0; i < n; i++) {
      const left = i % 2 === 0;
      confetti.push({
        x: left ? 0 : right, y: ch, vx: (left ? 1 : -1) * rand(200, Math.max(260, right * 0.9)),
        vy: -Math.sqrt(2 * 1100 * ch * rand(0.45, 1)), rot: rand(0, TAU), vr: rand(-14, 14),
        w: rand(6, 12), h: rand(4, 8), c: cols[i % cols.length], life: rand(2.6, 4),
      });
    }
  }
  function drawOverlay(dt) {
    const slow = clamp((1 - S.timeScale) / 0.65, 0, 1);
    if (slow > 0.02) {
      const g = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.28, cw / 2, ch / 2, Math.hypot(cw, ch) * 0.62);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(70,0,30,' + (0.62 * slow).toFixed(3) + ')');
      ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
    }
    if (flash > 0) { ctx.globalAlpha = flash * 0.5; ctx.fillStyle = C['rail-hi']; ctx.fillRect(0, 0, cw, ch); ctx.globalAlpha = 1; }
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.vy += 1100 * dt; p.vx *= Math.exp(-dt * 0.9); p.vy *= Math.exp(-dt * 0.5);
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
      if (p.life <= 0 || (p.vy > 0 && p.y > ch + 30)) { confetti.splice(i, 1); continue; }
      const sq = Math.abs(Math.cos(p.rot * 1.7));
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, (-p.h / 2) * sq, p.w, p.h * sq + 0.6);
      ctx.restore();
    }
  }

  // minimap
  const mm = { w: 0, h: 0, sx: 1, sy: 1, cache: null };
  function buildMini() {
    const w = el.mini.clientWidth, h = el.mini.clientHeight;
    if (!w || !h) return;
    el.mini.width = Math.round(w * dpr); el.mini.height = Math.round(h * dpr);
    mm.w = w; mm.h = h; mm.sx = (w - 8) / W; mm.sy = (h - 8) / WORLD_H;
    const c = document.createElement('canvas'); c.width = el.mini.width; c.height = el.mini.height;
    const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const X = (x) => 4 + x * mm.sx, Y = (y) => 4 + y * mm.sy;
    g.fillStyle = C.cabinet; g.fillRect(0, 0, w, h);
    g.fillStyle = C.field; g.fillRect(4, 4, W * mm.sx, WORLD_H * mm.sy);
    g.fillStyle = C['field-2'];
    for (let i = 1; i < SECTIONS.length; i += 2) {
      const a = SECTIONS[i].y, b = i + 1 < SECTIONS.length ? SECTIONS[i + 1].y : FINISH_Y;
      g.fillRect(4, Y(a), W * mm.sx, (b - a) * mm.sy);
    }
    g.globalAlpha = 0.5; g.fillStyle = C.chrome;
    for (const o of statics) if (o.t === 'pin') g.fillRect(X(o.x) - 0.5, Y(o.y) - 0.5, 1, 1);
    g.globalAlpha = 1; g.strokeStyle = C.rail; g.lineWidth = 1.2; g.lineCap = 'round'; g.beginPath();
    for (const o of statics) if (o.t === 'seg' && !o.gate) { g.moveTo(X(o.ax), Y(o.ay)); g.lineTo(X(o.bx), Y(o.by)); }
    g.stroke();
    g.fillStyle = C.hot;
    for (const o of statics) if (o.t === 'bump') { g.beginPath(); g.ellipse(X(o.x), Y(o.y), o.R * mm.sx, Math.max(1.3, o.R * mm.sy), 0, 0, TAU); g.fill(); }
    g.globalAlpha = 0.6; g.strokeStyle = C.chrome; g.lineWidth = 1;
    for (const o of dyns) {
      g.beginPath();
      if (o.t === 'rot') g.ellipse(X(o.cx), Y(o.cy), o.R * mm.sx, o.R * mm.sy, 0, 0, TAU);
      else { g.moveTo(X(o.base - o.amp - o.half), Y(o.y)); g.lineTo(X(o.base + o.amp + o.half), Y(o.y)); }
      g.stroke();
    }
    g.globalAlpha = 1; g.fillStyle = C.win; g.fillRect(4, Y(FINISH_Y) - 1, W * mm.sx, 2);
    mm.cache = c;
  }
  function drawMini() {
    if (!mm.cache) return;
    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.clearRect(0, 0, el.mini.width, el.mini.height);
    mctx.drawImage(mm.cache, 0, 0);
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const a = clamp(viewY0, 0, WORLD_H), b = clamp(viewY1, 0, WORLD_H);
    mctx.globalAlpha = 0.14; mctx.fillStyle = C.ink; mctx.fillRect(1, 4 + a * mm.sy, mm.w - 2, (b - a) * mm.sy);
    mctx.globalAlpha = 0.85; mctx.strokeStyle = C.ink; mctx.lineWidth = 1;
    mctx.strokeRect(1.5, 4 + a * mm.sy + 0.5, mm.w - 3, Math.max(2, (b - a) * mm.sy - 1));
    mctx.globalAlpha = 1;
    for (const m of marbles) {
      mctx.fillStyle = m.color;
      mctx.fillRect(4 + m.x * mm.sx - 1.5, 4 + m.y * mm.sy - 1.5, 3, 3);
    }
    mctx.strokeStyle = C.win; mctx.lineWidth = 1.5;
    for (const m of S.winnerList) { mctx.beginPath(); mctx.arc(4 + m.x * mm.sx, 4 + m.y * mm.sy, 4, 0, TAU); mctx.stroke(); }
  }

  // ---------- DOM: ranking ----------
  const rows = new Map();
  let rowKey = '';
  function buildRankRows() {
    el.rankList.innerHTML = ''; rows.clear(); rowKey = '';
    for (const m of marbles) {
      const li = document.createElement('li');
      const b = document.createElement('button'); b.type = 'button'; b.className = 'row';
      b.style.setProperty('--c', m.color);
      const pos = document.createElement('span'); pos.className = 'pos';
      const dot = document.createElement('span'); dot.className = 'dot';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = m.tag;
      const meta = document.createElement('span'); meta.className = 'meta';
      b.append(pos, dot, nm, meta); li.appendChild(b);
      b.addEventListener('click', () => toggleFollow(m.id));
      b.setAttribute('aria-label', m.tag + ' 따라가기');
      rows.set(m.id, { li, b, pos, meta, c: '', m: '', p: '' });

  }
  function updateRanking() {
    if (S.phase === 'idle') return;
    const run = [];
    for (const m of marbles) if (!m.fin) run.push(m);
    run.sort((a, b) => b.y - a.y);
    let list = S.finishOrder.concat(run);
    list.forEach((m, i) => { m.rank = i + 1; });
    if (S.mode === 'last') list = list.slice().reverse();
    const key = list.map((m) => m.id).join(',');
    if (key !== rowKey) {
      rowKey = key;
      const frag = document.createDocumentFragment();
      for (const m of list) frag.appendChild(rows.get(m.id).li);
      el.rankList.appendChild(frag);
    }
    const first = S.finishOrder[0];
    for (const m of list) {
      const r = rows.get(m.id);
      const meta = m.fin ? (m === first ? m.ft.toFixed(2) + 's' : '+' + (m.ft - first.ft).toFixed(2) + 's') : meters(m.y) + 'm';
      if (r.m !== meta) { r.meta.textContent = meta; r.m = meta; }
      const p = String(m.rank);
      if (r.p !== p) { r.pos.textContent = p; r.p = p; }
      const cls = 'row' + (m.fin ? ' fin' : '') + (m.won ? ' win' : '') + (S.mode === 'last' && m.fin && !m.won ? ' safe' : '') + (m.id === S.follow ? ' followed' : '');
      if (r.c !== cls) { r.b.className = cls; r.c = cls; }
    }
    S.hot.clear();
    if (S.phase === 'racing') {
      const src = S.mode === 'first' ? run.filter((m) => !S.winnerNames.has(m.name)) : run.slice().reverse();
      for (let i = 0; i < Math.min(3, src.length); i++) S.hot.add(src[i].id);
    }
    el.rankInfo.textContent = S.phase === 'done' ? '당첨 ' + S.winnerList.length + '명 확정'
      : S.mode === 'first' ? '결승 ' + S.finishOrder.length + ' / ' + marbles.length
      : '남은 ' + S.remain.size + '명';
  }
  function updateLeaderbar() {
    let text = '', p = 0;
    if (S.phase === 'idle') text = '구슬 ' + marbles.length + '개가 출발 게이트에서 기다리는 중';
    else if (S.phase === 'countdown') text = '게이트가 곧 열려요';
    else if (S.phase === 'racing') {
      const t = S.mode === 'first' ? S.leader : S.back;
      if (t) { text = (S.mode === 'first' ? '선두 ' : '꼴찌 ') + t.name + ' · 결승까지 ' + meters(t.y) + 'm'; p = clamp(t.y / FINISH_Y, 0, 1); }
    } else { text = '당첨 ' + S.winnerList.map((m) => m.name).join(', '); p = 1; }
    if (el.lbText.textContent !== text) el.lbText.textContent = text;

  let lastStatus = '';

    let s;

    else if (S.phase === 'racing') s = 'STAGE ' + (S.sectionIdx + 1) + '/' + SECTIONS.length + ' · ' + SECTIONS[S.sectionIdx].name + (S.timeScale < 0.8 ? ' · 슬로모션' : '');
    else s = '레이스 종료';

  function toggleFollow(id) {

  function updateFollowChip() {

    el.followChip.hidden = !m;
    if (m) el.followChip.innerHTML = '<span class="fdot" style="--c:' + m.color + '"></span><span>' + esc(m.tag) + ' 따라가는 중</span><span aria-hidden="true">✕</span>';
  }

  // ---------- DOM: participants & settings ----------
  function parse(text) {
    return String(text).split(/[,\n\r\t;，、]+/).map((s) => s.trim()).filter(Boolean).map((s) => {
      const mt = s.match(/^(.*?)\s*[*×]\s*(\d{1,3})$/);
      if (mt && mt[1].trim()) return { name: mt[1].trim().slice(0, NAME_MAX), weight: clamp(parseInt(mt[2], 10) || 1, 1, MAX_WEIGHT) };
      return { name: s.slice(0, NAME_MAX), weight: 1 };
    });
  }
  const totalMarbles = () => S.participants.reduce((a, p) => a + p.weight, 0);
  const maxK = () => Math.max(1, S.participants.length - 1);
  function addFromText(text) {
    const items = parse(text);
    if (!items.length) return;
    if (S.example) { S.participants = []; S.example = false; }
    let added = 0, bumped = 0, capped = false;
    for (const it of items) {
      const room = MAX_MARBLES - totalMarbles();
      if (room <= 0) { capped = true; break; }
      if (it.weight > room) capped = true;
      const ex = S.participants.find((p) => p.name === it.name);
      if (ex) {
        const nw = Math.min(MAX_WEIGHT, ex.weight + Math.min(it.weight, room));
        if (nw > ex.weight) { ex.weight = nw; bumped++; }
      } else { S.participants.push({ name: it.name, weight: Math.min(it.weight, room) }); added++; }
    }
    const parts = [];
    if (added) parts.push(added + '명을 추가했어요.');
    if (bumped) parts.push('이미 있는 이름은 구슬 수를 늘렸어요.');
    if (capped) parts.push('구슬은 최대 ' + MAX_MARBLES + '개까지 넣을 수 있어요.');
    setMsg(parts.join(' '));
    changed();
  }
  function changed() {
    renderChips(); renderSettings(); save();
    if (S.phase === 'idle') spawnMarbles();
  }
  function renderChips() {
    el.chips.innerHTML = '';
    S.participants.forEach((p, i) => {
      const li = document.createElement('li'); li.className = 'chip'; li.style.setProperty('--c', colorOf(i));
      const dot = document.createElement('span'); dot.className = 'dot';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name;
      li.append(dot, nm);
      if (p.weight > 1) { const w = document.createElement('span'); w.className = 'wt'; w.textContent = '×' + p.weight; li.appendChild(w); }
      const x = document.createElement('button'); x.type = 'button'; x.className = 'x'; x.textContent = '×';
      x.setAttribute('aria-label', p.name + ' 삭제');
      x.addEventListener('click', () => { S.participants.splice(i, 1); S.example = false; changed(); });
      li.appendChild(x);
      el.chips.appendChild(li);
    });
    el.countLabel.textContent = S.participants.length + '명 · 구슬 ' + totalMarbles() + '개';
    el.exampleNote.hidden = !S.example;
    el.clearBtn.hidden = S.participants.length === 0;
  }
  function renderSettings() {
    S.winners = clamp(S.winners, 1, maxK());
    el.modeFirst.setAttribute('aria-pressed', String(S.mode === 'first'));
    el.modeLast.setAttribute('aria-pressed', String(S.mode === 'last'));

    el.ruleSub.textContent = S.mode === 'first'
      ? '결승선을 가장 먼저 넘는 구슬의 주인이 당첨돼요.'

  function setPhaseUI() {

  // ---------- persistence ----------
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ participants: S.participants, example: S.example, mode: S.mode, winners: S.winners, muted: S.muted }));
    } catch (e) { /* storage unavailable */ }
  }
  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function sanitize(list) {
    const out = [], seen = new Set();
    let total = 0;
    for (const p of list) {
      if (!p || typeof p.name !== 'string') continue;
      const name = p.name.trim().slice(0, NAME_MAX);
      if (!name || seen.has(name)) continue;
      const w = clamp(parseInt(p.weight, 10) || 1, 1, MAX_WEIGHT);
      if (total + w > MAX_MARBLES) break;
      seen.add(name); out.push({ name, weight: w }); total += w;
    }
    return out;
  }
  function snapshot() { return { participants: S.participants, example: S.example, mode: S.mode, winners: S.winners, muted: S.muted }; }

  });
  el.modeFirst.addEventListener('click', () => { S.mode = 'first'; renderSettings(); save(); });
  el.modeLast.addEventListener('click', () => { S.mode = 'last'; renderSettings(); save(); });
  el.kMinus.addEventListener('click', () => { S.winners--; renderSettings(); save(); });
  el.kPlus.addEventListener('click', () => { S.winners++; renderSettings(); save(); });
  el.goBtn.addEventListener('click', () => {
    Snd.init();
    if (S.phase === 'idle') startRace(); else resetIdle();
  });
  el.reopenBtn.addEventListener('click', showResult);
  el.againBtn.addEventListener('click', () => { Snd.init(); resetIdle(); startRace(); });
  el.excludeBtn.addEventListener('click', () => {
    Snd.init();
    S.participants = S.participants.filter((p) => !S.winnerNames.has(p.name));
    S.example = false; save();
    resetIdle(); startRace();
  });
  el.closeBtn.addEventListener('click', hideResult);
  el.result.addEventListener('click', (e) => { if (e.target === el.result) hideResult(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !el.result.hidden) hideResult(); });
  el.copyBtn.addEventListener('click', () => {
    const text = resultText();
    const ok = () => { el.copyBtn.textContent = '복사했어요'; };
    const fail = () => {
      el.copyFallback.hidden = false; el.copyFallback.value = text;
      el.copyFallback.focus(); el.copyFallback.select();
      el.copyBtn.textContent = '아래 글을 복사하세요';
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fail);
      else fail();
    } catch (e) { fail(); }
  });
  function renderSound() {
    el.soundBtn.setAttribute('aria-pressed', String(!S.muted));
    el.soundLbl.textContent = S.muted ? '소리 끔' : '소리 켬';
    el.soundWave.toggleAttribute('hidden', S.muted);
    el.soundMute.toggleAttribute('hidden', !S.muted);
    el.soundBtn.setAttribute('aria-label', S.muted ? '소리 켜기' : '소리 끄기');
  }
  el.soundBtn.addEventListener('click', () => { S.muted = !S.muted; Snd.init(); renderSound(); save(); });
  el.followChip.addEventListener('click', () => { S.follow = null; updateFollowChip(); });

  let drag = null;
  el.view.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, moved: false };
    try { el.view.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  el.view.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.moved && Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 6) { drag.moved = true; el.view.classList.add('dragging'); }
    if (drag.moved) manualPan(-dx / lastS, -dy / lastS);
  });
  function endDrag(e) {
    if (drag && !drag.moved && e.type === 'pointerup') {
      const r = el.view.getBoundingClientRect();
      const wx = (e.clientX - r.left - lastOx) / lastS, wy = (e.clientY - r.top - lastOy) / lastS;
      let best = null, bd = (26 / lastS) * (26 / lastS);
      for (const m of marbles) { const d = (m.x - wx) * (m.x - wx) + (m.y - wy) * (m.y - wy); if (d < bd) { bd = d; best = m; } }
      if (best) toggleFollow(best.id);
    }
    drag = null; el.view.classList.remove('dragging');
  }
  el.view.addEventListener('pointerup', endDrag);
  el.view.addEventListener('pointercancel', endDrag);
  el.view.addEventListener('wheel', (e) => { e.preventDefault(); manualPan(0, (e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY) / lastS); }, { passive: false });
  let miniDrag = false;
  function miniJump(e) {
    const r = el.mini.getBoundingClientRect();
    manualTo(S.manual ? S.manual.x : cam.x, (e.clientY - r.top - 4) / mm.sy);
  }
  el.mini.addEventListener('pointerdown', (e) => { miniDrag = true; try { el.mini.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } miniJump(e); });
  el.mini.addEventListener('pointermove', (e) => { if (miniDrag) miniJump(e); });
  el.mini.addEventListener('pointerup', () => { miniDrag = false; });
  el.mini.addEventListener('pointercancel', () => { miniDrag = false; });

  function resize() {
    const r = el.stage.getBoundingClientRect();
    cw = Math.max(1, r.width); ch = Math.max(1, r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    el.view.width = Math.round(cw * dpr); el.view.height = Math.round(ch * dpr);
    buildMini();
  }

  // ---------- loop ----------
  let last = 0, acc = 0, uiT = 0;
  function loop(now) {
    const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0;
    last = now;
    phaseTick(dt);
    tempo(dt);
    acc += dt * S.timeScale;
    let steps = 0;
    while (acc >= STEP && steps < MAX_STEPS) { step(STEP); acc -= STEP; steps++; }
    if (steps >= MAX_STEPS) acc = 0;
    afterSim(dt);
    updateCamera(dt);
    render(dt);
    updateHud();
    uiT -= dt;
    if (uiT <= 0) { uiT = 0.12; updateRanking(); updateLeaderbar(); }
    requestAnimationFrame(loop);
  }

  function boot(data) {
    const saved = data && Array.isArray(data.participants) ? data : load();
    const list = saved && Array.isArray(saved.participants) ? sanitize(saved.participants) : [];
    if (list.length) { S.participants = list; S.example = !!saved.example; }
    else { S.participants = EXAMPLES.map((name) => ({ name, weight: 1 })); S.example = true; }
    if (saved) {
      S.mode = saved.mode === 'last' ? 'last' : 'first';
      S.winners = parseInt(saved.winners, 10) || 1;
      S.muted = !!saved.muted;
    }
    buildCourse();
    randomizeCourse();
    resize();
    if (window.ResizeObserver) new ResizeObserver(resize).observe(el.stage);
    else window.addEventListener('resize', resize);
    renderChips(); renderSettings(); renderSound();
    spawnMarbles();
    setPhaseUI();
    updateLeaderbar();
    requestAnimationFrame(loop);
  }

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(snapshot);
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
